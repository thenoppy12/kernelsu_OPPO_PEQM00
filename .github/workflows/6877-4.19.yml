name: build KSU kernel - OPPO Reno6

on:
  workflow_dispatch:
jobs:
  build-kernel:
  # replace by github action runner if you dont have self-hosted runner
    runs-on: fkrystal-1 
    steps:
      - name: Pull toolchain
        run: |
          cd $HOME
          rm -rf aarch64-linux-android-4.9
          rm -rf arm-linux-androideabi-4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-linux-androideabi-4.9
      - name: Pull clang
        run: |
          cd $HOME
          rm -rf clang
          git clone https://github.com/thenoppy12/clang-r416183b.git clang --depth=1
      - name: Pull kernel source
        run: |
          rm -rf android_kernel_oppo_mt6877-oppo-mt6877_t_13.1.0_reno7_5g.zip
          rm -rf kernel-4.19
          aria2c https://github.com/oppo-source/android_kernel_oppo_mt6877/archive/refs/heads/oppo/mt6877_t_13.1.0_reno7_5g.zip
          unzip -q android_kernel_oppo_mt6877-oppo-mt6877_t_13.1.0_reno7_5g.zip 
          mv android_kernel_oppo_mt6877-oppo-mt6877_t_13.1.0_reno7_5g kernel-4.19 -v
      - name: Pull kernel vendor source
        run: |
          rm -rf android_kernel_modules_oppo_mtk_4.19
          git clone https://github.com/oppo-source/android_kernel_modules_oppo_mtk_4.19/
          sleep 1s
          cp android_kernel_modules_oppo_mtk_4.19/vendor/oplus/kernel_4.19/audio/* kernel-4.19/sound/soc/codecs -R -v
      #- name: Sync KernelSU
        # "/home/fkrystal/action-runner/_work" 
        # its my self-hosted runner
        # if you use github action runner
        # change these string above into 
        # "/home/runner/work"
        #run: |
          #cd /home/fkrystal/action-runner/_work/kernelsu_OPPO_PEQM00/kernelsu_OPPO_PEQM00/kernel-4.19
          #curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@main
        with: 
         max-size: 4G
         key: r6-419
      - name: Build kernel with KernelSU - OPPO Reno 6
        # "/home/fkrystal/action-runner/_work" 
        # its my self-hosted runner
        # if you use github action runner
        # change these string above into 
        # "/home/runner/work"
        run: |
          cd /home/fkrystal/action-runner/_work/kernelsu_OPPO_PEQM00/kernelsu_OPPO_PEQM00/kernel-4.19
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 k6877v1_64_k419_defconfig
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=$HOME/aarch64-linux-android-4.9 CROSS_COMPILE_ARM32=$HOME/arm-linux-androideabi-4.9
      - name: Upload kernel to artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6877-4.19-ksu
          path: kernel-4.19/out/arch/arm64/boot/*
